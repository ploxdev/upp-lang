name: derleyici

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "bootstrap/**"
      - ".github/workflows/derleyici.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "bootstrap/**"
      - ".github/workflows/derleyici.yml"

jobs:
  native-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: QEMU (Linux, çekirdek testleri)
        if: runner.os != 'Windows'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-system-x86
      - name: Bootstrap uppc (Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p derleyici
          gcc -std=gnu11 -O2 bootstrap/uppc.c -o derleyici/uppc -pthread -lm
          ./derleyici/uppc --surum
      - name: Self-host sabit noktası (Linux)
        if: runner.os != 'Windows'
        run: |
          ./derleyici/uppc kendini-derle
          git diff --exit-code -- bootstrap/uppc.c src/uppc/gomulu_runtime.upp
      - name: Bootstrap uppc (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p derleyici
          gcc -std=gnu11 -O2 bootstrap/uppc.c -o derleyici/uppc.exe -luser32 -lwinmm -lgdi32
          ./derleyici/uppc.exe --surum
      - name: Testler
        env:
          PYTHONUTF8: "1"
        run: python tests/run_tests.py

  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap uppc
        run: |
          mkdir -p derleyici
          gcc -std=gnu11 -O2 bootstrap/uppc.c -o derleyici/uppc -pthread -lm
      - name: TSAN runtime + yoğun arkaplan
        env:
          PYTHONUTF8: "1"
          UPP_SANITIZE: "-fsanitize=thread -g -O1"
        run: |
          python tests/run_tests.py --uppc derleyici/uppc --kategori runtime
          python tests/run_tests.py --uppc derleyici/uppc --dosya tests/positive/20_arkaplan_yogun.upp
