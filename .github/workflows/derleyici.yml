name: derleyici

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "araclar/**"
      - "bootstrap/**"
      - ".github/workflows/derleyici.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "araclar/**"
      - "bootstrap/**"
      - ".github/workflows/derleyici.yml"

jobs:
  native-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Bootstrap uppc
        shell: ${{ runner.os == 'Windows' && 'msys2 {0}' || 'bash' }}
        run: |
          mkdir -p derleyici
          if [ "${{ runner.os }}" = "Windows" ]; then
            gcc -std=gnu11 -O2 bootstrap/uppc.c -o derleyici/uppc.exe -luser32 -lwinmm -lgdi32
            ./derleyici/uppc.exe --surum
          else
            gcc -std=gnu11 -O2 bootstrap/uppc.c -o derleyici/uppc -pthread -lm
            ./derleyici/uppc --surum
          fi
      - name: Testler
        env:
          PYTHONUTF8: "1"
        run: python tests/run_tests.py

  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bootstrap uppc
        run: |
          mkdir -p derleyici
          gcc -std=gnu11 -O2 bootstrap/uppc.c -o derleyici/uppc -pthread -lm
      - name: TSAN runtime + yoğun arkaplan
        env:
          PYTHONUTF8: "1"
          UPP_SANITIZE: "-fsanitize=thread -g -O1"
        run: |
          python tests/run_tests.py --uppc derleyici/uppc --kategori runtime
          python tests/run_tests.py --uppc derleyici/uppc --dosya tests/positive/20_arkaplan_yogun.upp
