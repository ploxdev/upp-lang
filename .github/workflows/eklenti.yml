name: eklenti

on:
  push:
    paths:
      - "eklenti/**"
      - ".github/workflows/eklenti.yml"
  pull_request:
    paths:
      - "eklenti/**"
      - ".github/workflows/eklenti.yml"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: eklenti
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: eklenti/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run compile
      - name: Native --surum --json (ikili varsa)
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set +e
          for c in derleyici/uppc.exe derleyici/uppc derleyici/uppc.out; do
            if [ -f "$c" ]; then
              echo "smoke: $c"
              out="$("$c" --surum --json)"
              echo "$out"
              echo "$out" | grep -q '"dil":"u++"' && echo "$out" | grep -q '"protokol":1'
              exit $?
            fi
          done
          echo "native uppc yok; birim testleri yeterli"
          exit 0
